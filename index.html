<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anvil Optimizer — Minecraft 1.21+ Enchantment Combiner</title>
    <meta name="description" content="Find the optimal anvil combination order for your Minecraft items and enchanted books. Minimize XP cost or Prior Work Penalty.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- ── Header ───────────────────────────────── -->
        <header>
            <div class="title-group">
                <div class="icon">⚒️</div>
                <div>
                    <h1>Anvil Optimizer</h1>
                    <p>Minecraft 1.21+ · Optimal Enchantment Combination Calculator</p>
                </div>
            </div>
            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="xp" id="mode-xp">⚡ Min XP</button>
                <button class="mode-btn" data-mode="pwp" id="mode-pwp">🛡 Min PWP</button>
            </div>
        </header>

        <!-- ── Two-Panel Layout ─────────────────────── -->
        <div class="main-grid">
            <!-- LEFT: Inventory Input -->
            <aside class="panel inventory-panel">
                <div class="panel-header">
                    <h2>Your Inventory</h2>
                    <span id="item-count" style="font-size:0.72rem;color:var(--text-3)">0 items</span>
                </div>
                <div class="panel-body" id="inventory-body">
                    <div id="inventory-list">
                        <!-- Item cards rendered dynamically -->
                    </div>
                    <div class="btn-group">
                        <button class="btn" id="btn-add-item">⚔️ Add Item</button>
                        <button class="btn" id="btn-add-book">📗 Add Book</button>
                    </div>
                    <label class="toggle-option">
                        <input type="checkbox" id="toggle-conflicts">
                        <span>Allow Conflicting Enchantments</span>
                    </label>
                    <button class="btn btn-calculate" id="btn-calculate">▶ Calculate Optimal Path</button>
                </div>
            </aside>

            <!-- RIGHT: Combination Protocol -->
            <section class="panel protocol-panel">
                <div class="panel-header">
                    <h2>Combination Protocol</h2>
                    <span id="protocol-status" style="font-size:0.72rem;color:var(--text-3)"></span>
                </div>
                <div class="panel-body" id="protocol-body">
                    <!-- Empty State -->
                    <div id="protocol-empty" class="empty-state">
                        <div class="empty-icon">📋</div>
                        <h3>No Protocol Yet</h3>
                        <p>Add your items and books on the left, then click Calculate to see the optimal combination order.</p>
                    </div>

                    <!-- Results (hidden initially) -->
                    <div id="protocol-results" class="hidden">
                        <div id="protocol-warnings"></div>
                        <div id="protocol-summary" class="protocol-summary"></div>
                        <div id="protocol-steps" class="step-list"></div>
                    </div>

                    <!-- Error state -->
                    <div id="protocol-error" class="hidden"></div>
                </div>
            </section>
        </div>
    </div>
    <script src="sprites.js"></script>
    <script src="app.js"></script>
</body>
</html>
